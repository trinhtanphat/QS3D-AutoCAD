name: Package native AutoCAD bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 0.1.0

jobs:
  package:
    runs-on: [self-hosted, Windows, X64, autocad-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build bundle
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: QS3D-AutoCAD-${{ inputs.version }}
          path: artifacts/QS3D-AutoCAD-${{ inputs.version }}.zip
          if-no-files-found: error
