name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-and-guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Smoke .NET 8
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release -f net8.0
      - name: Smoke .NET 10
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release -f net10.0
      - name: Architecture and bundle guards
        shell: pwsh
        run: ./scripts/validate-architecture.ps1
