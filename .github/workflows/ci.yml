name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "recovery/**"
      - "integration/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-host-and-guards:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact checkout SHA
        shell: pwsh
        run: |
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'.ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checkout SHA mismatch: expected $expected, actual $actual"
          }
          Write-Host "Exact source SHA: $actual"
          $platform = (& git -C external/QS3D-Platform rev-parse HEAD).Trim().ToLowerInvariant()
          if ($platform -ne 'e029d4ba0de6ffe80575f7aed96affa1db1b9b33') {
            throw "QS3D-Platform pin mismatch: expected e029d4ba0de6ffe80575f7aed96affa1db1b9b33, actual $platform"
          }
          Write-Host "Exact QS3D-Platform SHA: $platform"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Smoke .NET 8
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release -f net8.0
      - name: Smoke .NET 10
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release -f net10.0
      - name: Build AutoCAD 2021 host
        run: dotnet build src/QS3D.AutoCAD/QS3D.AutoCAD.csproj -c Release -f net48
      - name: Build AutoCAD 2025-2026 host
        run: dotnet build src/QS3D.AutoCAD/QS3D.AutoCAD.csproj -c Release -f net8.0-windows
      - name: Build AutoCAD 2027 host
        run: dotnet build src/QS3D.AutoCAD/QS3D.AutoCAD.csproj -c Release -f net10.0-windows
      - name: Cubicost MEP shared-parity guard
        shell: pwsh
        run: ./scripts/validate-cubicost-mep-parity.ps1
      - name: Cubicost MEP review/profile guard
        shell: pwsh
        run: ./scripts/validate-cubicost-mep-review-profile.ps1
      - name: Architecture and bundle guards
        shell: pwsh
        run: ./scripts/validate-architecture.ps1
      - name: Release security policy guards
        shell: pwsh
        run: ./scripts/validate-release-policy.ps1
      - name: Native acceptance contract guards
        shell: pwsh
        run: ./scripts/validate-native-acceptance-contract.ps1
      - name: Operational readiness tooling guards
        shell: pwsh
        run: ./scripts/test-ops-tooling.ps1
      - name: Package and verify release contract
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version '0.0.0-ci'
          ./scripts/verify-artifacts.ps1 -Version '0.0.0-ci'
      - name: Setup install/uninstall runtime smoke
        shell: pwsh
        run: ./scripts/test-installer-runtime.ps1 -SetupPath 'artifacts/QS3D-AutoCAD-0.0.0-ci-Setup.exe'
      - name: Upload verified engineering native candidate
        if: github.event_name == 'push'
        id: native-candidate-upload
        uses: actions/upload-artifact@v7
        with:
          name: QS3D-AutoCAD-native-candidate-${{ github.sha }}
          path: |
            artifacts/QS3D-AutoCAD-0.0.0-ci.zip
            artifacts/QS3D-AutoCAD-0.0.0-ci-Setup.exe
            artifacts/RELEASE-PROVENANCE.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Report engineering native candidate
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "Engineering artifact id: ${{ steps.native-candidate-upload.outputs.artifact-id }}"
          Write-Host "Engineering artifact digest: ${{ steps.native-candidate-upload.outputs.artifact-digest }}"
          Write-Host "Engineering artifact URL: ${{ steps.native-candidate-upload.outputs.artifact-url }}"
          Write-Host "Candidate source SHA: ${{ github.sha }}"
          Write-Host 'This is an engineering/native-acceptance candidate, not a signed commercial release and not native PASS.'
      - name: Native acceptance rejection smoke
        shell: pwsh
        run: ./scripts/test-native-acceptance-failclosed.ps1 -Version '0.0.0-ci'
      - name: Authenticode signing plumbing smoke
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/test-signing.ps1 -FilePath 'src/QS3D.AutoCAD/bin/Release/net8.0-windows/QS3D.AutoCAD.dll'
